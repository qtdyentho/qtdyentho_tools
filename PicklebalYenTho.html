    <script>
        (function autoPurgeStaleCaches() {
            const CURRENT_VERSION = 'v2026.08.01-v6.2';
            const lastVersion = localStorage.getItem('pickleball_app_version');

            if (lastVersion !== CURRENT_VERSION) {
                // 1. Unregister all stale Service Workers
                if ('serviceWorker' in navigator) {
                    navigator.serviceWorker.getRegistrations().then(function (registrations) {
                        for (var r of registrations) r.unregister();
                    }).catch(function () { });
                }

                // 2. Clear CacheStorage
                if ('caches' in window) {
                    caches.keys().then(function (keys) {
                        keys.forEach(function (k) { caches.delete(k); });
                    }).catch(function () { });
                }

                // 3. Purge legacy version keys
                localStorage.setItem('pickleball_app_version', CURRENT_VERSION);
                console.log('[Pickleball App] Auto purged stale cache to version ' + CURRENT_VERSION);
            }
        })();
    </script>

                                window.location.reload(true);
                            } else {

                        setSaveStatus("Lỗi kết nối GitHub");
                    }
                } catch (err) {
                    alert("⚠️ Lỗi kiểm tra cập nhật: " + err.message);
                    setSaveStatus("Lỗi cập nhật");
                }
            };

            // =====================================================
            // DATA BACKUP: Download local + Push to GitHub API
            // =====================================================
            const GITHUB_API_OWNER = 'qtdyentho';
            const GITHUB_API_REPO  = 'qtdyentho_tools';
            const GITHUB_API_PATH  = 'QTD_Tools/pickleball_data_backup.json';

            const pushDataToGitHub = async (pat, jsonContent) => {
                const apiUrl = `https://api.github.com/repos/${GITHUB_API_OWNER}/${GITHUB_API_REPO}/contents/${GITHUB_API_PATH}`;
                const headers = {
                    'Authorization': `token ${pat}`,
                    'Accept': 'application/vnd.github+json',
                    'X-GitHub-Api-Version': '2022-11-28',
                    'Content-Type': 'application/json'
                };

                // 1. Get current SHA (needed for update)
                let sha = null;
                try {
                    const getRes = await fetch(apiUrl, { headers });
                    if (getRes.ok) {
                        const existing = await getRes.json();
                        sha = existing.sha;
                    }
                } catch (_) {}

                // 2. Encode content as Base64
                const contentBase64 = btoa(unescape(encodeURIComponent(jsonContent)));
                const commitDate = new Date().toLocaleString('vi-VN', { timeZone: 'Asia/Ho_Chi_Minh' });

                // 3. Commit via PUT
                const body = {
                    message: `🏓 Sao lưu dữ liệu Pickleball Yên Thọ - ${commitDate}`,
                    content: contentBase64,
                    branch: 'main'
                };
                if (sha) body.sha = sha;

                const putRes = await fetch(apiUrl, {
                    method: 'PUT',
                    headers,
                    body: JSON.stringify(body)
                });

                if (putRes.ok) {
                    return { success: true };
                } else {
                    const errBody = await putRes.json().catch(() => ({}));
                    return { success: false, error: errBody.message || putRes.statusText };
                }
            };

            const exportDataBackupJSON = async () => {

                const anchor = document.createElement('a');
                anchor.setAttribute('href', dataStr);

                                </button>

                            </div>
                        </div>
                    </div>

                    {/* MODAL: ADD ATHLETE - BOTTOM SHEET ON MOBILE, CENTER ON DESKTOP */}
                    {showAddModal && (
                        <>

                                <form onSubmit={handleAddAthleteSubmit} className="space-y-3.5 text-xs">
                                    <div>

                                            type="text"
                                            required
                                            placeholder="Ví dụ: Nguyễn Văn A..."
                                            value={newAthleteName}

                                        />
                                    </div>

                                    <div className="grid grid-cols-2 gap-3">
                                        <div>
                                            <label className="block text-slate-300 light:text-slate-700 font-bold mb-1">Đơn vị / CLB</label>
                                            <input 
                                                type="text"
                                                placeholder="CLB Yên Thọ / Khách mời..."
                                                value={newAthleteUnit}
                                                onChange={e => setNewAthleteUnit(e.target.value)}

                                            />

                                            <label className="block text-slate-300 light:text-slate-700 font-bold mb-1">Giới tính</label>
                                            <select 
                                                value={newAthleteGender}
                                                onChange={e => {

                                                }}
                                                className="w-full px-3.5 py-2.5 bg-slate-800 light:bg-sky-50 border border-slate-700 light:border-sky-200 rounded-2xl text-white light:text-slate-900 focus:outline-none font-medium">
                                                <option value="male">♂ Nam</option>
                                                <option value="female">♀ Nữ</option>
                                            </select>
                                        </div>
                                    </div>

                                    <div className="pt-2 border-t border-slate-800 light:border-slate-200 space-y-2">
                                        <label className="block text-slate-300 light:text-slate-700 font-bold">Đăng ký Nội dung & Hậu cần:</label>

                                        <label className="flex items-center gap-2.5 cursor-pointer p-2.5 bg-slate-800/60 light:bg-sky-50 rounded-2xl">
                                            <input 
                                                type="checkbox"
                                                checked={newAthleteMens}
                                                disabled={newAthleteGender === 'female'}
                                                onChange={e => setNewAthleteMens(e.target.checked)}
                                                className="w-4 h-4 rounded accent-indigo-500"
                                            />
                                            <span className="text-slate-200 light:text-slate-800 font-medium">Đôi Nam (Chỉ dành cho Nam)</span>
                                        </label>

                                        <label className="flex items-center gap-2.5 cursor-pointer p-2.5 bg-slate-800/60 light:bg-sky-50 rounded-2xl">
                                            <input 
                                                type="checkbox"
                                                checked={newAthleteMixed}
                                                onChange={e => setNewAthleteMixed(e.target.checked)}
                                                className="w-4 h-4 rounded accent-purple-500"
                                            />
                                            <span className="text-slate-200 light:text-slate-800 font-medium">Đôi Nam Nữ</span>
                                        </label>

                                        <label className="flex items-center gap-2.5 cursor-pointer p-2.5 bg-slate-800/60 light:bg-sky-50 rounded-2xl">

                                    </div>
                                </form>
                                    </div>

                    {/* ========= GITHUB PAT SETTINGS MODAL ========= */}
                    {showGithubModal && (

                            <div className="glass-panel bg-slate-900 light:bg-white p-6 rounded-3xl max-w-lg w-full border border-slate-700/80 light:border-sky-200 space-y-5 shadow-2xl">
                                {/* Header */}
                                <div className="flex justify-between items-center pb-3 border-b border-slate-700/60 light:border-slate-200">
                                    <h3 className="font-extrabold text-white light:text-slate-900 text-base flex items-center gap-2">
                                        <i className="fa-brands fa-github text-emerald-400 text-lg"></i>
                                        <span>Cài đặt GitHub Backup</span>
                                        {githubPAT && <span className="px-2 py-0.5 bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 rounded-full text-[10px] font-extrabold">✅ Đã kết nối</span>}
                                    </h3>
                                    <button onClick={() => setShowGithubModal(false)} className="text-slate-400 hover:text-white p-1">
                                        <i className="fa-solid fa-xmark text-lg"></i>
                                    </button>
                                </div>

                                            <code className="bg-blue-900/50 px-1 rounded text-[10px]">qtdyentho/qtdyentho_tools/QTD_Tools/pickleball_data_backup.json</code>

                                    </label>
                                    <input
                                        type="password"
                                        placeholder="ghp_xxxxxxxxxxxxxxxxxxxx"

                                           target="_blank" rel="noopener"

                                {/* Action Buttons */}

                                    <button
                                        onClick={() => {
                                            const input = document.getElementById('github-pat-input');

                                                setShowGithubModal(false);

                                        <i className="fa-solid fa-tower-broadcast text-emerald-400 text-lg"></i>
                                        <span>Dong Bo Realtime</span>

                                    </h3>
                                    <button onClick={() => setShowSyncModal(false)} className="text-slate-400 hover:text-white p-1">
                                        <i className="fa-solid fa-xmark text-lg"></i>

                                </div>

                                {syncStatus !== 'idle' && (
                                    <div className={`p-3 rounded-2xl text-xs font-bold flex items-center gap-2 border ${
                                        syncStatus === 'syncing' ? 'bg-amber-900/30 border-amber-500/30 text-amber-300' :
                                        syncStatus === 'success' ? 'bg-emerald-900/30 border-emerald-500/30 text-emerald-300' :
                                        'bg-rose-900/30 border-rose-500/30 text-rose-300'
                                    }`}>
                                        <i className={`fa-solid ${syncStatus === 'syncing' ? 'fa-rotate fa-spin' : syncStatus === 'success' ? 'fa-check-circle' : 'fa-triangle-exclamation'}`}></i>
                                        {syncStatus === 'syncing' ? 'Dang ket noi...' :
                                         syncStatus === 'success' ? `Da dong bo luc ${syncLastTime ? syncLastTime.toLocaleTimeString('vi-VN') : ''}` :
                                         'Loi ket noi - Kiem tra API Key & Bin ID'}
                                    </div>
                                )}

                                <div className="flex gap-3 flex-wrap pt-1">
                                    <button
                                        onClick={() => {
                                            const key = document.getElementById('sync-api-key-input').value.trim();
                                            const bid = document.getElementById('sync-bin-id-input').value.trim();
                                            handleInitSync(key, bid);
                                        }}
                                        disabled={syncStatus === 'syncing'}
                                        className="flex-1 py-3 bg-gradient-to-r from-emerald-600 to-blue-700 text-white rounded-2xl font-extrabold text-sm shadow-lg shadow-emerald-500/20 flex items-center justify-center gap-2 disabled:opacity-60 active:scale-95 transition">
                                        <i className={`fa-solid ${syncStatus === 'syncing' ? 'fa-rotate fa-spin' : 'fa-tower-broadcast'}`}></i>
                                        <span>{syncBinId ? 'Ket noi Bin nay' : 'Tao Bin Moi & Kich Hoat'}</span>
                                    </button>
                                    {isSyncEnabled && (
                                        <button
                                            onClick={handleCopyShareLink}
                                            className="px-4 py-3 bg-indigo-700 hover:bg-indigo-600 text-white rounded-2xl font-bold text-sm flex items-center gap-2 active:scale-95 transition">
                                            <i className="fa-solid fa-link"></i>
                                            <span className="hidden sm:inline">Copy Link</span>
                                        </button>
                                    )}
                                    <button
                                        onClick={() => setShowSyncModal(false)}
                                        className="px-5 py-3 bg-slate-800 text-slate-300 rounded-2xl font-bold text-sm active:scale-95 transition">
                                        Dong
                                    </button>
                                </div>

                                {isSyncEnabled && (
                                    <div className="pt-3 border-t border-slate-800">
                                        <button
                                            onClick={handleDisableSync}
                                            className="text-xs text-rose-400 hover:text-rose-300 underline flex items-center gap-1.5 transition">
                                            <i className="fa-solid fa-power-off text-[10px]"></i>
                                            Tat dong bo (Xoa ket noi Bin)
                                        </button>
                                    </div>
                                )}
                            </div>
                        </div>
                    )}

                    {/* ========= TOAST NOTIFICATION CONTAINER ========= */}
                    <div className="toast-container no-print">
                        {toasts.map(t => (
                            <div key={t.id} className={`toast ${t.exiting ? 'exit' : ''}`}
                                style={{
                                    background: t.type === 'success' ? 'rgba(6,78,59,0.95)' :
                                                t.type === 'error'   ? 'rgba(127,29,29,0.95)' :
                                                'rgba(15,23,42,0.95)',
                                    borderColor: t.type === 'success' ? 'rgba(52,211,153,0.4)' :
                                                 t.type === 'error'   ? 'rgba(252,165,165,0.4)' :
                                                 'rgba(255,255,255,0.12)',
                                }}>
                                {t.msg}
                            </div>
                        ))}
                    </div>

                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
